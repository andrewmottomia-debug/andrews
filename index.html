<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef0f5;--fg:#18202c;--mut:#667085;--card:#fff;--line:#d3d8e3;--ac:#2f5bea;--ok:#12805c;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--fg:#eceff5;--mut:#9aa3b5;--card:#1a2030;--line:#2a3144;--ac:#7c9bff;--ok:#4cd6a0;--no:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--fg:#eceff5;--mut:#9aa3b5;--card:#1a2030;--line:#2a3144;--ac:#7c9bff;--ok:#4cd6a0;--no:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 'Bricolage Grotesque',system-ui,'Noto Sans SC','Noto Sans Cuneiform',sans-serif;min-height:100vh}
h1{font-size:22px;font-weight:800;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:26px;font-weight:800;margin:0 0 8px}h3{font-size:15px;font-weight:600;margin:22px 0 6px;color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px}
.pad{padding:4px 20px 40px;max-width:560px;margin:0 auto}
.mid{display:flex;flex-direction:column;gap:14px;min-height:70vh;justify-content:center}
.b{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
.p{background:var(--ac);color:#fff;border-radius:16px;padding:14px 18px;font-weight:800;width:100%}
.big{padding:20px;font-size:19px;margin-bottom:12px}
.danger{color:var(--no);margin-top:14px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .b,.row .p{flex:1}
.mut{color:var(--mut)}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 20px 24px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.dk{flex:0 0 80%;max-width:340px;scroll-snap-align:center;height:min(62vh,470px);border-radius:30px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.dk .ic{font-size:64px;line-height:1}.dk .n{font-size:84px;font-weight:800;line-height:1}.dk .nm{font-size:24px;font-weight:600;overflow-wrap:anywhere}
.sel{padding:0 20px 4px}.sel select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
label{display:block;font-weight:600;margin:12px 0 0;font-size:14px;color:var(--mut)}
input[type=text],input:not([type]),input[type=number],textarea{display:block;width:100%;margin-top:6px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:17px}
input[type=color]{display:block;width:100%;height:46px;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.ck{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:400;font-size:16px}.ck input{width:20px;height:20px}
.sw,.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sq{width:34px;height:34px;border-radius:10px}.fl button{font-size:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:46px;height:46px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.li div:first-child{min-width:0;overflow-wrap:anywhere}
.q{font-size:44px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ansr{font-size:34px;font-weight:600;overflow-wrap:anywhere}
.res{font-weight:600}.ok,.okt{color:var(--ok)}.no{color:var(--no)}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 2px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:14px}.g span{color:var(--mut);font-size:12px}.g.sug{border:2px solid var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.mo{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.mo textarea{height:200px;font:13px/1.4 ui-monospace,monospace}.mo .row{margin-top:12px}.mo input[type=file]{margin-top:10px}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),MIN=6e4,DAY=864e5;
let db,V={v:'home'};
try{db=JSON.parse(localStorage.getItem('fc1'))}catch(e){}
if(!db||!Array.isArray(db.decks))db={decks:[],ordem:'visitado'};
const save=()=>{try{localStorage.setItem('fc1',JSON.stringify(db))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=i=>db.decks.find(x=>x.id===i),gd=()=>find(V.d);
const DEF={ignorar_maiusculas:true,ignorar_pontuacao:true,ignorar_acentos:false,tons_como_numeros:false,novos_por_dia:20,revisoes_por_dia:200};
const MODOS={traducao_para_termo:['traducao','termo','Português → idioma estudado'],termo_para_traducao:['termo','traducao','Idioma estudado → português'],pronuncia:['termo','pronuncia','Escrever a pronúncia'],revelar:['termo','traducao','Só revelar (sem digitar)']};
const COR=['#2f5bea','#b91c1c','#0f766e','#7c3aed','#d97706','#be185d','#334155','#15803d'];
const FL='🇧🇷 🇫🇷 🇨🇳 🇯🇵 🇰🇷 🇪🇸 🇮🇹 🇩🇪 🇬🇧 🇺🇸 🇷🇺 🇵🇹 🇸🇦 🇮🇳 🇹🇷 🇬🇷 🇮🇱 🇳🇱 🇸🇪 🇳🇴 🇵🇱 🇺🇦 🇻🇳 🇹🇭 🇮🇩 🇦🇷 🇲🇽 🇮🇷 🇪🇬 🇫🇮 🇭🇺 🇨🇿 🇦🇺 🇨🇦 📚 ⭐ 🏺'.split(' ');
const cfg=d=>Object.assign({},DEF,d.config);
const dayStart=t=>{const o=new Date(t).getTimezoneOffset()*6e4,l=t-o-1.44e7;return Math.floor(l/DAY)*DAY+1.44e7+o};
const cnt=d=>{const ds=dayStart(Date.now());if(!d.hoje||d.hoje.d!==ds)d.hoje={d:ds,n:0,r:0};return d.hoje};
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const dark=h=>{const[r,g,b]=rgb(h);return(.299*r+.587*g+.114*b)/255<.6};
function hue(h){const[r,g,b]=rgb(h).map(v=>v/255),M=Math.max(r,g,b),m=Math.min(r,g,b);if(M===m)return -1;const d=M-m,x=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return(x*60+360)%360}
/* ---------- agendamento (SM-2 estilo Anki) ---------- */
const ST=[1,10];
function items(d){const r=[];d.cards.forEach(c=>d.modos.forEach(m=>{const M=MODOS[m];if(!M||!c[M[0]]||!c[M[1]])return;r.push({c,m,s:(c.st&&c.st[m])||null})}));return r}
function pend(d,now=Date.now()){const k=cfg(d),h=cnt(d),ds=dayStart(now);let l=0,rv=0,nw=0;
 items(d).forEach(i=>{const s=i.s;if(!s)nw++;else if(s.s==='r'){if(s.due<=ds)rv++}else if(s.due<=now+20*MIN)l++});
 return l+Math.min(rv,Math.max(0,k.revisoes_por_dia-h.r))+Math.min(nw,Math.max(0,k.novos_por_dia-h.n))}
function next(d,now=Date.now()){const k=cfg(d),h=cnt(d),ds=dayStart(now),it=items(d);
 const L=it.filter(i=>i.s&&i.s.s!=='r'&&i.s.due<=now+20*MIN).sort((a,b)=>a.s.due-b.s.due);if(L[0])return L[0];
 if(h.r<k.revisoes_por_dia){const R=it.filter(i=>i.s&&i.s.s==='r'&&i.s.due<=ds);if(R.length)return R[Math.floor(Math.random()*R.length)]}
 if(h.n<k.novos_por_dia){const N=it.filter(i=>!i.s);if(N[0])return N[0]}return null}
function grade(o,g,now){const s=o?{...o}:{s:'n',step:0,ivl:0,ease:2.5,lapses:0},ds=dayStart(now);
 const grad=iv=>{s.s='r';s.ivl=iv;s.due=ds+iv*DAY;return s};
 if(s.s==='n'||s.s==='l'){
  if(g===1){s.s='l';s.step=0;s.due=now+ST[0]*MIN}
  else if(g===2){s.s='l';s.due=now+(s.step===0?6:ST[s.step])*MIN}
  else if(g===3){if(s.step+1>=ST.length)return grad(1);s.s='l';s.step++;s.due=now+ST[s.step]*MIN}
  else return grad(4)
 }else if(s.s==='r'){
  if(g===1){s.lapses++;s.ease=Math.max(1.3,s.ease-.2);s.s='x';s.step=0;s.ivl=1;s.due=now+10*MIN}
  else{const i=s.ivl,e=s.ease;let n;
   if(g===2){n=Math.max(i+1,Math.round(i*1.2));s.ease=Math.max(1.3,e-.15)}
   else if(g===3)n=Math.max(i+1,Math.round(i*e));
   else{n=Math.max(Math.round(i*e)+1,Math.round(i*e*1.3));s.ease=e+.15}
   return grad(n)}
 }else{if(g<=2)s.due=now+10*MIN;else return grad(g===4?s.ivl+1:s.ivl)}
 return s}
function lab(s,now){if(s.s==='r'){const d=s.ivl;return d<30?d+' d':d<365?Math.round(d/30)+' mês':(d/365).toFixed(1)+' a'}const m=Math.max(1,Math.round((s.due-now)/MIN));return m<60?m+' min':Math.round(m/60)+' h'}
/* ---------- comparação de respostas ---------- */
const VM={a:['ā','á','ǎ','à'],e:['ē','é','ě','è'],i:['ī','í','ǐ','ì'],o:['ō','ó','ǒ','ò'],u:['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ']};
function tons(s){return s.replace(/([a-zA-ZüÜ:]+)([1-5])/g,(m,y,t)=>{y=y.replace(/u:/g,'ü').replace(/v/g,'ü');if(t==='5')return y;const l=y.toLowerCase();let k=l.search(/[ae]/);if(k<0&&l.includes('ou'))k=l.indexOf('o');if(k<0)for(let j=l.length-1;j>=0;j--)if('aeiouü'.includes(l[j])){k=j;break}return k<0?m:y.slice(0,k)+VM[l[k]][t-1]+y.slice(k+1)})}
function norm(s,k){s=String(s).normalize('NFC');if(k.tons_como_numeros)s=tons(s);if(k.ignorar_acentos)s=s.normalize('NFD').replace(/\p{M}/gu,'');if(k.ignorar_maiusculas)s=s.toLowerCase();if(k.ignorar_pontuacao)s=s.replace(/[\p{P}\p{S}]/gu,'');return s.normalize('NFC').replace(/\s+/g,' ').trim()}
/* ---------- importar / exportar ---------- */
const exp=d=>JSON.stringify({nome:d.nome,icone:d.icone,cor:d.cor,modos:d.modos,config:cfg(d),cards:d.cards.map(c=>({id:c.id,termo:c.termo,traducao:c.traducao,pronuncia:c.pronuncia||undefined,exemplo:c.exemplo||undefined,notas:c.notas||undefined,tags:c.tags&&c.tags.length?c.tags:undefined,respostas_aceitas:Object.keys(c.aceitas||{}).length?c.aceitas:undefined}))},null,2);
const TPL=JSON.stringify({nome:'Mandarim - Básico',icone:'🇨🇳',cor:'#b91c1c',modos:['traducao_para_termo','pronuncia'],config:{ignorar_maiusculas:true,ignorar_pontuacao:true,ignorar_acentos:false,tons_como_numeros:true,novos_por_dia:20,revisoes_por_dia:200},cards:[{id:'ola',termo:'你好',traducao:'olá',pronuncia:'nǐ hǎo',exemplo:'你好，我叫小明。',notas:'saudação comum',tags:['saudações'],respostas_aceitas:{traducao:['oi']}}]},null,2);
function doImport(txt,mode,dk){let j;try{j=JSON.parse(txt)}catch(e){return 'JSON inválido: '+e.message}
 if(mode==='all'){if(!j||!Array.isArray(j.decks))return 'Backup inválido.';db=j;save();return 'Backup restaurado.'}
 if(!j||!Array.isArray(j.cards))return 'O arquivo precisa ter a lista “cards”.';
 for(let n=0;n<j.cards.length;n++){const c=j.cards[n];if(!c||!c.termo)return 'Card '+(n+1)+' está sem “termo”.';if(!c.traducao)return 'Card '+(n+1)+' está sem “traducao”.'}
 const ms=(Array.isArray(j.modos)?j.modos:[]).filter(m=>MODOS[m]);let d=dk;
 if(!d){d={id:uid(),nome:j.nome||'Novo deck',icone:j.icone||'📚',cor:/^#[0-9a-f]{6}$/i.test(j.cor||'')?j.cor:'#2f5bea',modos:ms.length?ms:['traducao_para_termo'],config:j.config||{},cards:[],ultimo:0};db.decks.push(d)}
 else if(!d.cards.length){if(ms.length)d.modos=ms;if(j.config)d.config=Object.assign({},d.config,j.config)}
 let a=0,u=0,s=0;
 j.cards.forEach(c=>{const ex=d.cards.find(x=>c.id?x.id===c.id:(x.termo===c.termo&&x.traducao===c.traducao));
  const o={termo:String(c.termo),traducao:String(c.traducao),pronuncia:c.pronuncia||'',exemplo:c.exemplo||'',notas:c.notas||'',tags:c.tags||[],aceitas:c.respostas_aceitas||{}};
  if(ex){if(c.id){Object.assign(ex,o);u++}else s++}else{d.cards.push({id:c.id||uid(),...o});a++}});
 save();return a+' adicionados, '+u+' atualizados, '+s+' ignorados.'}
/* ---------- telas ---------- */
function home(){const a=[...db.decks];if(db.ordem==='cor')a.sort((x,y)=>hue(x.cor)-hue(y.cor));else a.sort((x,y)=>(x.ultimo||0)-(y.ultimo||0));
 return `<div class=top><h1>Meus decks</h1><button class=b data-a=bk>Backup</button><button class=b data-a=imp>Importar</button><button class=b data-a=new>＋ Deck</button></div>
 <div class=sel><select id=ord><option value=visitado ${db.ordem!=='cor'?'selected':''}>Menos visitado primeiro</option><option value=cor ${db.ordem==='cor'?'selected':''}>Por cor</option></select></div>`+
 (a.length?`<div class=car>${a.map(d=>{const dk=dark(d.cor);return `<div class=dk style="background:${d.cor};color:${dk?'#fff':'#1a2233'}" data-a=open data-i="${d.id}"><div class=ic>${esc(d.icone)}</div><div><div class=n style="color:${dk?'#ffe066':'#0b1a4a'}">${pend(d)}</div><div>pendentes</div></div><div class=nm>${esc(d.nome)}</div></div>`}).join('')}</div>`:`<div class=pad><p class=mut>Nenhum deck ainda. Toque em “＋ Deck” para criar o primeiro ou em “Importar” para carregar um arquivo JSON.</p></div>`)}
function deckv(){const d=gd();return `<div class=top><button class=b data-a=back>←</button><h1>${esc(d.icone)} ${esc(d.nome)}</h1><button class=b data-a=edt>Ajustes</button></div><div class=pad>
 <button class="p big" data-a=study>Estudar · ${pend(d)} pendentes</button>
 <div class=row><button class=b data-a=addc>＋ Card</button><button class=b data-a=impd>Importar</button><button class=b data-a=expd>Exportar</button><button class=b data-a=tpl>Modelo</button></div>
 <h3>${d.cards.length} cards</h3>${d.cards.map(c=>`<div class=li><div><b>${esc(c.termo)}</b> <span class=mut>${esc(c.traducao)}</span></div><div><button class=b data-a=ec data-i="${c.id}">✎</button> <button class=b data-a=dc data-i="${c.id}">${V.conf===c.id?'Excluir?':'✕'}</button></div></div>`).join('')||'<p class=mut>Nenhum card ainda. Adicione um ou importe um arquivo JSON.</p>'}</div>`}
function dform(){const d=V.id?find(V.id):null,k=Object.assign({},DEF,d&&d.config),ms=d?d.modos:['traducao_para_termo'],cor=d?d.cor:'#2f5bea';
 return `<div class=top><button class=b data-a="${d?'open':'back'}" data-i="${d?d.id:''}">←</button><h1>${d?'Ajustes do deck':'Novo deck'}</h1></div><div class=pad>
 <label>Nome<input id=f_n value="${esc(d?d.nome:'')}" placeholder="Francês básico"></label>
 <label>Cor de fundo<input id=f_c type=color value="${cor}"></label><div class=sw>${COR.map(c=>`<button class=sq style="background:${c}" data-a=col data-i="${c}"></button>`).join('')}</div>
 <label>Ícone (escolha uma bandeira ou digite um emoji)<input id=f_i value="${esc(d?d.icone:'🇫🇷')}"></label><div class=fl>${FL.map(f=>`<button data-a=ico data-i="${f}">${f}</button>`).join('')}</div>
 <h3>Modos de estudo</h3>${Object.keys(MODOS).map(m=>`<label class=ck><input type=checkbox name=m value="${m}" ${ms.includes(m)?'checked':''}>${MODOS[m][2]}</label>`).join('')}
 <h3>Comparação da resposta digitada</h3>${[['ignorar_maiusculas','Ignorar maiúsculas'],['ignorar_pontuacao','Ignorar pontuação'],['ignorar_acentos','Ignorar acentos (ca = ça)'],['tons_como_numeros','Tons como números (ni3 = nǐ)']].map(([x,l])=>`<label class=ck><input type=checkbox id="c_${x}" ${k[x]?'checked':''}>${l}</label>`).join('')}
 <h3>Limites diários</h3><label>Cards novos por dia<input id=c_n type=number min=0 value="${k.novos_por_dia}"></label><label>Revisões por dia<input id=c_r type=number min=0 value="${k.revisoes_por_dia}"></label>
 <div style="height:18px"></div><button class=p data-a=svd>Salvar deck</button>${d?`<button class="b danger" data-a=deld>${V.conf==='deck'?'Toque de novo para excluir':'Excluir deck'}</button>`:''}</div>`}
function cform(){const d=gd(),c=V.cid?d.cards.find(x=>x.id===V.cid):{};
 return `<div class=top><button class=b data-a=back2>←</button><h1>${V.cid?'Editar card':'Novo card'}</h1></div><div class=pad>${V.msg?`<p class=okt>${V.msg}</p>`:''}
 ${[['termo','Termo (idioma estudado)'],['traducao','Tradução (português)'],['pronuncia','Pronúncia (opcional)'],['exemplo','Exemplo (opcional)'],['notas','Notas (opcional)'],['tags','Tags, separadas por vírgula']].map(([k,l])=>`<label>${l}<input id="k_${k}" value="${esc(k==='tags'?(c.tags||[]).join(', '):c[k])}"></label>`).join('')}
 <div style="height:18px"></div><button class=p data-a=svc>Salvar card</button></div>`}
function stud(){const d=gd(),it=V.it;
 if(!it)return `<div class=top><button class=b data-a=back2>←</button></div><div class="pad mid"><h2>${d.cards.length?'Tudo em dia por hoje ✓':'Este deck está vazio'}</h2><p class=mut>${d.cards.length?'Volte mais tarde ou amanhã para as próximas revisões.':'Adicione cards ou importe um arquivo JSON.'}</p><button class=p data-a=back2>Voltar ao deck</button></div>`;
 const M=MODOS[it.m],c=it.c,typ=it.m!=='revelar',ans=c[M[1]];
 let h=`<div class=top><button class=b data-a=back2>✕</button><span class=mut>${pend(d)} restantes</span></div><div class="pad mid"><div class=mut>${M[2]}</div><div class=q>${esc(c[M[0]])}</div>`;
 if(!V.rev)h+=typ?`<input id=ans autocomplete=off autocapitalize=off autocorrect=off spellcheck=false placeholder="Digite a resposta"><button class=p data-a=chk>Verificar</button>`:`<button class=p data-a=chk>Mostrar resposta</button>`;
 else{if(typ)h+=`<div class="res ${V.ok?'ok':'no'}">${V.ok?'Acertou':'Não bateu'}${V.typed?': '+esc(V.typed):''}</div>`;
  h+=`<div class=ansr>${esc(ans)}</div>`+[c.pronuncia&&it.m!=='pronuncia'?'Pronúncia: '+c.pronuncia:'',c.exemplo,c.notas].filter(Boolean).map(x=>`<div class=mut>${esc(x)}</div>`).join('');
  const nw=Date.now(),sg=V.ok===true?3:V.ok===false?1:0;
  h+=`<div class=gr>`+[['De novo',1],['Difícil',2],['Bom',3],['Fácil',4]].map(([l,g])=>`<button class="g${g===sg?' sug':''}" data-a=gr data-i="${g}"><b>${l}</b><span>${lab(grade(it.s,g,nw),nw)}</span></button>`).join('')+`</div>`}
 return h+'</div>'}
function modal(){const m=V.modal;return `<div class=ov><div class=mo><h3 style="margin-top:0">${m.t}</h3>${m.msg?`<p class=okt>${esc(m.msg)}</p>`:''}<textarea id=mt spellcheck=false>${esc(m.txt)}</textarea>${m.imp?'<input type=file id=fi accept=".json,application/json">':''}<div class=row>${m.imp?'<button class=p data-a=doimp>Importar</button>':''}<button class=b data-a=cp>Copiar</button><button class=b data-a=cl>Fechar</button></div></div></div>`}
function render(){$('#app').innerHTML=({home,deck:deckv,dform,cform,study:stud})[V.v]()+(V.modal?modal():'');const f=$('#ans');if(f)f.focus()}
/* ---------- ações ---------- */
const A={
 new(){V={v:'dform',id:null}},open(i){V={v:'deck',d:i}},back(){V={v:'home'}},back2(){V={v:'deck',d:V.d}},edt(){V={v:'dform',id:V.d}},
 col(i){$('#f_c').value=i},ico(i){$('#f_i').value=i},
 svd(){const n=$('#f_n').value.trim();if(!n)return $('#f_n').focus();
  const ms=[...document.querySelectorAll('[name=m]:checked')].map(x=>x.value);if(!ms.length)ms.push('traducao_para_termo');
  const config={};['ignorar_maiusculas','ignorar_pontuacao','ignorar_acentos','tons_como_numeros'].forEach(x=>config[x]=$('#c_'+x).checked);
  config.novos_por_dia=+$('#c_n').value||0;config.revisoes_por_dia=+$('#c_r').value||0;
  let d=V.id?find(V.id):null;if(!d){d={id:uid(),cards:[],ultimo:0};db.decks.push(d)}
  Object.assign(d,{nome:n,cor:$('#f_c').value,icone:$('#f_i').value.trim()||'📚',modos:ms,config});save();V={v:'deck',d:d.id}},
 deld(){if(V.conf!=='deck'){V.conf='deck';return}db.decks=db.decks.filter(x=>x.id!==V.id);save();V={v:'home'}},
 addc(){V={v:'cform',d:V.d,cid:null}},ec(i){V={v:'cform',d:V.d,cid:i}},
 dc(i){const d=gd();if(V.conf===i){d.cards=d.cards.filter(x=>x.id!==i);save();V.conf=null}else V.conf=i},
 svc(){const g=k=>$('#k_'+k).value.trim(),t=g('termo'),r=g('traducao');if(!t||!r)return(t?$('#k_traducao'):$('#k_termo')).focus();
  const o={termo:t,traducao:r,pronuncia:g('pronuncia'),exemplo:g('exemplo'),notas:g('notas'),tags:g('tags').split(',').map(x=>x.trim()).filter(Boolean)},d=gd();
  if(V.cid){Object.assign(d.cards.find(x=>x.id===V.cid),o);save();V={v:'deck',d:d.id}}
  else{d.cards.push({id:uid(),aceitas:{},...o});save();V={v:'cform',d:d.id,cid:null,msg:'Card adicionado ✓'}}},
 imp(){V.modal={t:'Importar deck (novo)',txt:'',imp:'new'}},impd(){V.modal={t:'Importar cards neste deck',txt:'',imp:'deck'}},
 bk(){V.modal={t:'Backup de tudo (copie e guarde; cole aqui para restaurar)',txt:JSON.stringify(db),imp:'all'}},
 expd(){V.modal={t:'Exportar deck (copie o texto)',txt:exp(gd())}},tpl(){V.modal={t:'Modelo de deck',txt:TPL}},
 cl(){V.modal=null},
 cp(){const t=$('#mt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(_){}}return 1},
 doimp(){const m=V.modal;m.txt=$('#mt').value;m.msg=doImport(m.txt,m.imp,m.imp==='deck'?gd():null)},
 study(){V={v:'study',d:V.d,it:next(gd()),rev:false}},
 chk(){const it=V.it,d=gd();if(it.m==='revelar')V.ok=null;else{const f=MODOS[it.m][1],k=cfg(d);V.typed=$('#ans').value.trim();
  V.ok=!!V.typed&&[it.c[f],...((it.c.aceitas&&it.c.aceitas[f])||[])].some(x=>norm(x,k)===norm(V.typed,k))}V.rev=true},
 gr(g){g=+g;const it=V.it,d=gd(),h=cnt(d),now=Date.now();
  if(!it.s)h.n++;else if(it.s.s==='r')h.r++;
  it.c.st=it.c.st||{};it.c.st[it.m]=grade(it.s,g,now);d.ultimo=now;save();
  V.rev=false;V.ok=undefined;V.typed='';V.it=next(d)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(!f)return;const r=f(t.dataset.i);if(r===1)return;render()});
document.addEventListener('change',e=>{
 if(e.target.id==='ord'){db.ordem=e.target.value;save();render()}
 if(e.target.id==='fi'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#mt').value=r.result};r.readAsText(f)}});
document.addEventListener('keydown',e=>{if(V.v==='study'&&V.it&&e.key==='Enter'){if(!V.rev){A.chk();render()}}
 else if(V.v==='study'&&V.rev&&'1234'.includes(e.key)&&e.target.tagName!=='INPUT'){A.gr(e.key);render()}});
render();
</script></body></html>
